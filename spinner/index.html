    <title>Site</title>

    <style>
      * { box-sizing: border-box; }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #ffffff;
      }

      .spinner {
        width: 38px;
        height: 38px;
        border: 3px solid #e6edfb;
        border-top-color: #246bfd;
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 1.8s; }
      }
    </style>

      const redirectDelayMs = 1000;

      window.setTimeout(() => {
